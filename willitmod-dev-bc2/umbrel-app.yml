manifestVersion: 1
id: willitmod-dev-bc2
category: bitcoin
name: AxeBC2
version: "0.1.12-dev"
tagline: BC2 node + solo pool
description: >-
  ALPHA RELEASE (DEV CHANNEL)

  AxeBC2 is functional and has successfully found blocks, but it is still under
  active development. Expect rough edges, occasional breaking changes, and
  mining/pool behavior that may still need tuning.

  Use this build if you are happy to test, mine, and send helpful feedback.
  For known-good production setups, use stable/main channel apps.

  Run a BitcoinII (BC2) full node and an integrated solo Stratum v1 pool (ckpool) as a single app.


  Miner connection:
    - URL: `stratum+tcp://<node-ip>:2345`
    - Username: worker name (optional)
    - Password: anything


  Notes:
    - Set your payout address in the app Settings tab.
    - Supports Umbrel; on 5tratumOS, version 0.7.12 or newer is required.
    - The node makes outbound peer connections; this app does not publish a public P2P port or request NAT-PMP mappings.
    - Initial sync can take a long time and a lot of bandwidth/storage (the node downloads and validates the chain).
    - Solo mining is extremely unlikely to find blocks without significant hashrate.


  Components:
    - BitcoinII Core: https://github.com/Bitcoin-II/BitcoinII-Core
    - ckpool: https://github.com/ckolivas/ckpool
developer: WillItMod
website: https://github.com/WillItMod/AxeBC2
repo: https://github.com/WillItMod/AxeBC2
support: https://discord.gg/vC2UrFAbUF
dependencies: []
port: 21219
icon: https://raw.githubusercontent.com/WillItMod/5tratStore-dev/main/willitmod-dev-bc2/icon.png
gallery:
  - https://raw.githubusercontent.com/WillItMod/5tratStore-dev/main/willitmod-dev-bc2/icon.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Fixes Umbrel installation by removing its dependency on the 5tratumOS host
  build.json file. 5tratumOS keeps its existing startup recipe and OS version
  check. This packaging-only update retains the 0.1.11 application image,
  Core 31 migration checks, payout address, and existing blockchain data.

  Included fixes from 0.1.11:
  Corrects payout-address validation: BitcoinII Core-accepted mainnet addresses
  beginning with 1, 3, or bc1 are supported, while invalid or wrong-network
  addresses are rejected without changing the saved pool configuration. Settings
  are also left untouched while Core is unavailable, and payout checks left
  pending by an older release are retried at a bounded interval. It also removes
  the misleading payout warning from MAIN builds and performs a one-time,
  conditional CKPool /www ownership repair so existing sharelogs remain writable.
  This app-only update retains the accepted BitcoinII Core 31.1 image, existing
  blockchain and pool data, and the configured payout address; it does not
  trigger another blockchain reindex. On 5tratumOS, version 0.7.12 or newer is required.
  Stratum remains on TCP port 2345, telemetry remains disabled by default, and
  no public P2P port or NAT-PMP mapping is enabled.
widgets:
  - id: "sync"
    type: "text-with-progress"
    refresh: "5s"
    endpoint: "axebc2-app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "BC2 sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
  - id: "pool"
    type: "three-stats"
    refresh: "30s"
    endpoint: "axebc2-app:3000/api/widget/pool"
    link: ""
    example:
      type: "three-stats"
      link: ""
      items:
        - title: "Hashrate"
          text: "1.2"
          subtext: "TH/s"
        - title: "Workers"
          text: "2"
        - title: "Best Share"
          text: "21"
          subtext: "G"
backupIgnore:
  - data/node/blocks
  - data/node/chainstate
  - data/node/indexes
submitter: WillItMod
